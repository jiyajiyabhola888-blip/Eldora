<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | CareNest</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f8ff;
            color: #17213a;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 6%;
            background: white;
            box-shadow: 0 2px 15px rgba(0,0,0,0.06);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: #2563eb;
            font-size: 28px;
        }

        .logo h2 {
            color: #17213a;
        }

        .back-btn {
            text-decoration: none;
            color: #2563eb;
            font-weight: 600;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        /* ================= PAGE ================= */

        .edit-container {
            width: 90%;
            max-width: 800px;
            margin: 45px auto;
        }

        .edit-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .page-heading h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .page-heading p {
            color: #6b7280;
            font-size: 14px;
        }

        /* ================= FORM ================= */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dbe3f0;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: 0.2s;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
        }

        /* ================= BUTTONS ================= */

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 30px;
        }

        .cancel-btn,
        .save-btn {
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .cancel-btn {
            background: #eef2f7;
            color: #374151;
        }

        .cancel-btn:hover {
            background: #e2e8f0;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        /* ================= MESSAGE ================= */

        #message {
            display: none;
            margin-top: 20px;
            padding: 12px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 650px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .edit-card {
                padding: 25px;
            }

            .form-actions {
                flex-direction: column;
            }

            .cancel-btn,
            .save-btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>

<body>

<header>

    <nav class="navbar">

        <div class="logo">

            <i class="fa-solid fa-heart-pulse"></i>

            <h2>CareNest</h2>

        </div>

        <a href="caretaker-dashboard.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </a>

    </nav>

</header>


<main class="edit-container">

    <div class="edit-card">

        <div class="page-heading">

            <h1>Edit Caretaker Profile</h1>

            <p>
                Update your professional information and availability.
            </p>

        </div>


        <form id="editProfileForm">

            <div class="form-grid">

                <!-- NAME -->

                <div class="form-group">

                    <label for="editName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="editName"
                        required>

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="editEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="editEmail"
                        required>

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="editPhone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="editPhone"
                        required>

                </div>


                <!-- EXPERIENCE -->

                <div class="form-group">

                    <label for="editExperience">
                        Experience (Years)
                    </label>

                    <input
                        type="number"
                        id="editExperience"
                        min="0"
                        required>

                </div>


                <!-- SKILLS -->

                <div class="form-group full">

                    <label for="editSkills">
                        Skills
                    </label>

                    <textarea
                        id="editSkills"
                        required></textarea>

                </div>


                <!-- SERVICES -->

                <div class="form-group full">

                    <label for="editServices">
                        Services
                    </label>

                    <textarea
                        id="editServices"
                        required></textarea>

                </div>


                <!-- AVAILABILITY -->

                <div class="form-group full">

                    <label for="editAvailability">
                        Availability
                    </label>

                    <input
                        type="text"
                        id="editAvailability"
                        placeholder="Example: 8 AM - 5 PM"
                        required>

                </div>

            </div>


            <div id="message"></div>


            <div class="form-actions">

                <a
                    href="caretaker-dashboard.html"
                    class="cancel-btn">
                    Cancel
                </a>

                <button
                    type="submit"
                    class="save-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</main>


<script src="js/api.js"></script>
<script src="js/sos.js"></script>
<script>
    const caretakerId = getCaretakerId();
    let currentProfile = null;

    if (!caretakerId) {
        showToast("Caretaker ID not found. Please register or login.", "error");
        setTimeout(() => {
            window.location.href = "caretaker-register.html";
        }, 1500);
    } else {
        loadProfileForEditing(caretakerId);
    }

    async function loadProfileForEditing(id) {
        try {
            const data = await apiFetch(`/caretakers/${id}`);
            currentProfile = data;
            setCaretakerProfile(data);

            document.getElementById("editName").value = data.full_name || "";
            document.getElementById("editEmail").value = data.email || "";
            document.getElementById("editPhone").value = data.phone || "";
            document.getElementById("editExperience").value = data.experience_years || 0;
            document.getElementById("editSkills").value = data.skills || "";
            document.getElementById("editServices").value = data.services || "";
            document.getElementById("editAvailability").value = data.availability || "";
        } catch (error) {
            console.error("Failed to load profile for editing:", error);
            const cached = getCaretakerProfile();
            if (cached) {
                currentProfile = cached;
                document.getElementById("editName").value = cached.full_name || "";
                document.getElementById("editEmail").value = cached.email || "";
                document.getElementById("editPhone").value = cached.phone || "";
                document.getElementById("editExperience").value = cached.experience_years || 0;
                document.getElementById("editSkills").value = cached.skills || "";
                document.getElementById("editServices").value = cached.services || "";
                document.getElementById("editAvailability").value = cached.availability || "";
                showToast("Loaded offline profile copy", "warning");
            } else {
                showToast("Could not retrieve profile.", "error");
            }
        }
    }

    const editProfileForm = document.getElementById("editProfileForm");
    editProfileForm.addEventListener("submit", async function(e) {
        e.preventDefault();

        const message = document.getElementById("message");
        const saveBtn = editProfileForm.querySelector("button[type='submit']");
        const originalText = saveBtn.innerHTML;

        if (!caretakerId) {
            message.textContent = "Caretaker ID not found.";
            message.className = "error";
            return;
        }

        saveBtn.disabled = true;
        saveBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;

        const updatedData = {
            full_name: document.getElementById("editName").value.trim(),
            email: document.getElementById("editEmail").value.trim(),
            phone: document.getElementById("editPhone").value.trim(),
            experience_years: Number(document.getElementById("editExperience").value) || 0,
            skills: document.getElementById("editSkills").value.trim(),
            services: document.getElementById("editServices").value.trim(),
            availability: document.getElementById("editAvailability").value.trim(),
            verification_status: currentProfile ? currentProfile.verification_status : "pending",
            is_available: currentProfile ? currentProfile.is_available : true,
            profile_photo: currentProfile ? currentProfile.profile_photo : ""
        };

        try {
            const data = await apiFetch(`/caretakers/${caretakerId}`, {
                method: "PUT",
                body: JSON.stringify(updatedData)
            });

            setCaretakerProfile(data);
            message.textContent = "Profile updated successfully! 🎉";
            message.className = "success";
            showToast("Profile changes saved! Redirecting...", "success");

            setTimeout(() => {
                window.location.href = "caretaker-dashboard.html";
            }, 1000);
        } catch (error) {
            console.error("Save Profile Error:", error);
            message.textContent = error.message || "Profile update failed. Please try again.";
            message.className = "error";
            showToast(error.message || "Failed to update profile", "error");
        } finally {
            saveBtn.disabled = false;
            saveBtn.innerHTML = originalText;
        }
    });
</script>
</body>

</html>
