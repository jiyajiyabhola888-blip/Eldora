<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Become a Caretaker | CareNest</title>

    <link rel="stylesheet" href="css/auth.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

<div class="login-container">

    <!-- LEFT PANEL -->

    <div class="left-panel">

        <div class="overlay">

            <h1>Become a Caretaker ❤️</h1>

            <p>
                Join CareNest and make a difference in the lives
                of elders by providing trusted and compassionate care.
            </p>

        </div>

    </div>


    <!-- RIGHT PANEL -->

    <div class="right-panel">

        <form id="caretakerForm" class="login-form">

            <h2>Become a Caretaker</h2>

            <p class="subtitle">
                Create your caretaker profile
            </p>


            <!-- FULL NAME -->

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    id="caretakerName"
                    type="text"
                    placeholder="Full Name"
                    required>

            </div>


            <!-- EMAIL -->

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    id="caretakerEmail"
                    type="email"
                    placeholder="Email Address"
                    required>

            </div>


            <!-- PHONE -->

            <div class="input-box">

                <i class="fa-solid fa-phone"></i>

                <input
                    id="caretakerPhone"
                    type="tel"
                    placeholder="Mobile Number"
                    required>

            </div>


            <!-- EXPERIENCE -->

            <div class="input-box">

                <i class="fa-solid fa-briefcase"></i>

                <input
                    id="experienceYears"
                    type="number"
                    min="0"
                    placeholder="Experience (Years)"
                    required>

            </div>


            <!-- SKILLS -->

            <div class="input-box">

                <i class="fa-solid fa-heart"></i>

                <input
                    id="caretakerSkills"
                    type="text"
                    placeholder="Skills (e.g. Elder Care, First Aid)"
                    required>

            </div>


            <!-- SERVICES -->

            <div class="input-box">

                <i class="fa-solid fa-hand-holding-heart"></i>

                <input
                    id="caretakerServices"
                    type="text"
                    placeholder="Services you provide"
                    required>

            </div>


            <!-- AVAILABILITY -->

            <div class="input-box">

                <i class="fa-solid fa-clock"></i>

                <input
                    id="caretakerAvailability"
                    type="text"
                    placeholder="Availability (e.g. 9 AM - 5 PM)"
                    required>

            </div>


            <!-- SUBMIT -->

            <button type="submit" class="login-btn">

                Register as Caretaker

            </button>


            <p class="register-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </form>

    </div>

</div>


<script src="js/api.js"></script>
<script src="js/caretaker-register.js"></script>
</body>

</html>
